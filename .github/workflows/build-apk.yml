name: Build CoverMuse APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q CoverMuse.zip -d CoverMuse

      - name: Package offline fonts
        run: python3 CoverMuse/scripts/fetch_fonts.py CoverMuse/android/app/src/main/assets

      - name: Build debug APK
        working-directory: CoverMuse/android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoverMuse-APK
          path: CoverMuse/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q CoverMuse.zip

      - name: Package 120 offline fonts
